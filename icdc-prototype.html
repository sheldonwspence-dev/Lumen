<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  html, body { margin: 0; padding: 0; background: #FDFBF5; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

  /* iPad / touch optimizations */
  button, [role="button"] { -webkit-tap-highlight-color: transparent; }
  input, textarea { font-family: inherit; font-size: 16px; }  /* prevent iOS zoom */
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

  React.createElement("path", { d: "M21 12a9 9 0 1 1-6.219-8.56", key: 1 })

  React.createElement("line", { x1: 6, y1: 6, x2: 18, y2: 18, key: 2 })
);
const { useState } = React;



function LumenApp() {
  const [activeScreen, setActiveScreen] = useState("dashboard");
  const [popup, setPopup] = useState(null);

  return (
    <div style={{ minHeight: "100vh", background: "#FDFBF5", fontFamily: "'Inter', -apple-system, sans-serif", color: "#2C2C2A", position: "relative" }}>
      <div style={{ display: "flex", minHeight: "100vh" }}>
        <Sidebar activeScreen={activeScreen} setActiveScreen={setActiveScreen} setPopup={setPopup} />
        <main style={{ flex: 1, padding: "36px 48px", overflowY: "auto" }}>
          {activeScreen === "dashboard" && <DashboardScreen setActiveScreen={setActiveScreen} setPopup={setPopup} />}
          {activeScreen === "tools" && <ToolGuideScreen />}
          {activeScreen === "optimizer" && <OptimizerScreen />}
          {activeScreen === "next" && <WhatsNextScreen />}
          {activeScreen === "getstarted" && <GetStartedScreen />}
        </main>
      </div>

      {popup && <Popup popup={popup} onClose={() => setPopup(null)} />}

      <style>{`
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popupIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      `}</style>
    </div>
  );
}

function Popup({ popup, onClose }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(20, 20, 20, 0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: "20px" }}>
      <div style={{ background: "#FDFBF5", borderRadius: "14px", padding: "28px 32px", maxWidth: "400px", width: "100%", position: "relative", animation: "popupIn 0.2s ease", boxShadow: "0 20px 60px rgba(0,0,0,0.2)" }}>
        <button onClick={onClose} style={{ position: "absolute", top: "14px", right: "14px", background: "transparent", border: "none", cursor: "pointer", color: "#888780", padding: "4px" }}>
          <X size={18}/>
        </button>
        
        <div style={{ width: "48px", height: "48px", borderRadius: "50%", background: "#FAC775", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: "16px" }}>
          <Sparkles size={22} color="#854F0B"/>
        </div>

        <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "22px", fontWeight: 500, letterSpacing: "-0.5px", lineHeight: 1.2, marginBottom: "10px" }}>{popup.title}</div>
        <div style={{ fontSize: "13px", color: "#5F5E5A", lineHeight: 1.55, marginBottom: "20px" }}>{popup.body}</div>

        <button onClick={onClose} style={{ background: "#2C2C2A", color: "#FDFBF5", border: "none", padding: "10px 18px", borderRadius: "7px", fontSize: "13px", fontWeight: 500, cursor: "pointer", fontFamily: "inherit" }}>Got it</button>
      </div>
    </div>
  );
}

function Sidebar({ activeScreen, setActiveScreen, setPopup }) {
  const items = [
    { id: "dashboard", label: "Dashboard" },
    { id: "tools", label: "AI Tool Guide" },
    { id: "optimizer", label: "Prompt Optimizer", highlight: true },
    { id: "next", label: "What's Next" },
    { id: "getstarted", label: "Get Started" }
  ];

  return (
    <aside style={{ width: "220px", background: "#ffffff", borderRight: "0.5px solid #E5E2D8", padding: "28px 20px", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "36px" }}>
        <svg width="26" height="26" viewBox="0 0 42 42" fill="none">
          <path d="M11 7 L11 35 L31 35" stroke="#BA7517" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
          <circle cx="31" cy="11" r="4" fill="#EF9F27"/>
          <circle cx="31" cy="11" r="7" fill="none" stroke="#EF9F27" strokeWidth="1" opacity="0.4"/>
        </svg>
        <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "22px", fontWeight: 500, letterSpacing: "-0.5px" }}>Lumen</div>
      </div>

      <nav style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
        {items.map(item => (
          <div key={item.id} onClick={() => setActiveScreen(item.id)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "9px 12px", borderRadius: "7px", background: activeScreen === item.id ? "#FAEEDA" : "transparent", cursor: "pointer", fontSize: "13px", color: activeScreen === item.id ? "#854F0B" : "#5F5E5A", fontWeight: activeScreen === item.id ? 500 : 400 }}>
            <span>{item.label}</span>
            {item.highlight && <span style={{ fontSize: "9px", background: "#EF9F27", color: "#ffffff", padding: "2px 6px", borderRadius: "4px", letterSpacing: "0.5px" }}>NEW</span>}
          </div>
        ))}
      </nav>

      <div style={{ marginTop: "auto", padding: "16px", background: "#FAEEDA", borderRadius: "10px" }}>
        <div style={{ fontSize: "11px", color: "#854F0B", letterSpacing: "1.5px", marginBottom: "6px" }}>ON THE STARTER PLAN</div>
        <div style={{ fontSize: "12px", color: "#5F5E5A", lineHeight: 1.4, marginBottom: "10px" }}>Upgrade to Pro to unlock the full course library and Prompt Optimizer.</div>
        <button onClick={() => setActiveScreen("getstarted")} style={{ width: "100%", background: "#EF9F27", color: "#ffffff", border: "none", padding: "8px", borderRadius: "6px", fontSize: "12px", fontWeight: 500, cursor: "pointer", fontFamily: "inherit" }}>See plans</button>
      </div>
    </aside>
  );
}

function DashboardScreen({ setActiveScreen, setPopup }) {
  const [quickPrompt, setQuickPrompt] = useState("");
  const [suggestion, setSuggestion] = useState(null);

  const handleQuickSubmit = () => {
    if (!quickPrompt.trim()) return;
    const p = quickPrompt.toLowerCase();
    let matched;
    if (p.includes("grant") || p.includes("proposal") || p.includes("funder")) {
      matched = { category: "Grant Writing", tool: "Claude", template: "Consultant Prompt" };
    } else if (p.includes("donor") || p.includes("thank") || p.includes("appeal") || p.includes("fundrais")) {
      matched = { category: "Donor Outreach", tool: "ChatGPT", template: "Personalized Thank-You" };
    } else if (p.includes("board") || p.includes("report") || p.includes("meeting")) {
      matched = { category: "Board Reports", tool: "Claude", template: "Board Report Draft" };
    } else if (p.includes("social") || p.includes("post") || p.includes("instagram") || p.includes("linkedin")) {
      matched = { category: "Social Media", tool: "ChatGPT", template: "Social Kit" };
    } else if (p.includes("volunteer") || p.includes("recruit")) {
      matched = { category: "Volunteer Recruitment", tool: "Claude", template: "Recruitment Post" };
    } else {
      matched = { category: "this task", tool: "the Prompt Optimizer", template: null };
    }
    setSuggestion(matched);
    setQuickPrompt("");
  };

  const recentActivity = [
    { name: "Sarah M.", role: "Grants Coordinator", action: "completed a grant application", time: "18 min", saved: "5.5 hrs saved", tooltip: "Used the Consultant Prompt template with Claude. Drafted a $45K foundation grant proposal in 18 minutes — average similar task took her team 6 hours." },
    { name: "David L.", role: "Development Associate", action: "drafted donor thank-you emails", time: "9 min", saved: "2 hrs saved", tooltip: "Generated 12 personalized thank-you emails using donor history data. Average hand-written batch takes 2 hours." },
    { name: "Priya K.", role: "Program Director", action: "generated a board report", time: "22 min", saved: "4 hrs saved", tooltip: "Compiled Q4 program metrics into a board-ready report. Previous quarterly reports took ~4 hours of manual compilation." },
  ];

  return (
    <>
      <div style={{ marginBottom: "32px" }}>
        <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "30px", fontWeight: 500, letterSpacing: "-0.8px", lineHeight: 1.1 }}>Good afternoon.</div>
        <div style={{ fontSize: "14px", color: "#5F5E5A", marginTop: "6px" }}>Your team saved <span style={{ color: "#BA7517", fontWeight: 500 }}>47 hours</span> this week.</div>
      </div>

      <div style={{ background: "#ffffff", border: "0.5px solid #E5E2D8", borderRadius: "14px", padding: "28px", marginBottom: "24px", position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", top: "-40px", right: "-40px", width: "200px", height: "200px", borderRadius: "50%", background: "radial-gradient(circle, rgba(239, 159, 39, 0.15), rgba(239, 159, 39, 0))" }}></div>
        <div style={{ position: "relative", zIndex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "10px" }}>
            <Sparkles size={16} color="#BA7517" />
            <div style={{ fontSize: "11px", color: "#854F0B", letterSpacing: "2px", fontWeight: 500 }}>WHAT'S ON YOUR PLATE?</div>
          </div>
          <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "20px", fontWeight: 500, marginBottom: "16px", letterSpacing: "-0.3px" }}>Tell Lumen what you're working on.</div>
          <div style={{ display: "flex", gap: "10px" }}>
            <input type="text" value={quickPrompt} onChange={(e) => setQuickPrompt(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleQuickSubmit()} placeholder="e.g., 'draft a grant for a local foundation...'" style={{ flex: 1, border: "0.5px solid #D3D1C7", borderRadius: "8px", padding: "12px 14px", fontSize: "14px", outline: "none", background: "#FDFBF5", fontFamily: "inherit" }} />
            <button onClick={handleQuickSubmit} style={{ background: "#2C2C2A", color: "#ffffff", border: "none", padding: "0 20px", borderRadius: "8px", fontSize: "13px", fontWeight: 500, cursor: "pointer", display: "flex", alignItems: "center", gap: "6px" }}>
              Guide me <ArrowUpRight size={14} />
            </button>
          </div>
          {suggestion && (
            <div style={{ marginTop: "16px", padding: "14px 16px", background: "#FAEEDA", borderRadius: "8px", borderLeft: "3px solid #EF9F27" }}>
              <div style={{ fontSize: "11px", color: "#854F0B", letterSpacing: "1.5px", marginBottom: "6px", fontWeight: 500 }}>LUMEN SUGGESTS</div>
              <div style={{ fontSize: "13px", color: "#2C2C2A", lineHeight: 1.5, marginBottom: "10px" }}>
                {suggestion.template 
                  ? <>For <strong>{suggestion.category.toLowerCase()}</strong>, start with <strong>{suggestion.tool}</strong> and our <strong>"{suggestion.template}"</strong> template.</>
                  : <>Let's sharpen that prompt first — open the Prompt Optimizer to get better results from any AI.</>
                }
              </div>
              <button onClick={() => setActiveScreen("optimizer")} style={{ background: "#ffffff", border: "0.5px solid #BA7517", color: "#BA7517", padding: "6px 12px", borderRadius: "6px", fontSize: "12px", fontWeight: 500, cursor: "pointer" }}>Open Prompt Optimizer →</button>
            </div>
          )}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "14px", marginBottom: "24px" }}>
        <StatCard icon={<Clock size={16} color="#BA7517" />} label="TIME SAVED" value="47 hrs" delta="+12 hrs vs last week" tooltip="Calculated from 23 tasks completed this week across 8 active team members. Measured against baseline times from pre-Lumen workflows." />
        <StatCard icon={<Users size={16} color="#BA7517" />} label="TEAM ACTIVE" value="8 of 10" delta="2 joined this month" tooltip="8 team members used Lumen in the last 7 days. 2 members haven't logged in yet — consider a quick intro session." />
        <StatCard icon={<TrendingUp size={16} color="#BA7517" />} label="MISSION IMPACT" value="+23%" delta="donor reports published" tooltip="Donor-facing reports increased 23% quarter-over-quarter. More reports = more transparency = stronger donor retention." />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: "14px" }}>
        <div style={{ background: "#ffffff", border: "0.5px solid #E5E2D8", borderRadius: "14px", padding: "22px 24px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
            <div style={{ fontSize: "11px", color: "#888780", letterSpacing: "2px", fontWeight: 500 }}>RECENT WINS</div>
            <div onClick={() => setPopup({ title: "Full activity log", body: "Every AI-assisted task your team completes is logged here — what they worked on, how long it took, how much time was saved, and which prompt templates were used. The full log lives in the Pro plan." })} style={{ fontSize: "12px", color: "#BA7517", cursor: "pointer" }}>See all →</div>
          </div>
          {recentActivity.map((item, i) => (
            <ActivityItem key={i} item={item} isLast={i === recentActivity.length - 1} />
          ))}
        </div>

        <div style={{ background: "#2C2C2A", borderRadius: "14px", padding: "22px 24px", color: "#FDFBF5", display: "flex", flexDirection: "column" }}>
          <div style={{ fontSize: "11px", color: "#FAC775", letterSpacing: "2px", fontWeight: 500, marginBottom: "12px" }}>THIS WEEK'S INSIGHT</div>
          <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "18px", fontWeight: 500, lineHeight: 1.3, marginBottom: "14px", letterSpacing: "-0.2px" }}>Your team uses AI for drafts, not analysis yet.</div>
          <div style={{ fontSize: "12px", color: "#D3D1C7", lineHeight: 1.5, marginBottom: "auto" }}>Orgs using AI for donor analysis see a 23% retention lift.</div>
          <button onClick={() => setActiveScreen("tools")} style={{ marginTop: "16px", background: "#EF9F27", color: "#2C2C2A", border: "none", padding: "9px 14px", borderRadius: "7px", fontSize: "12px", fontWeight: 500, cursor: "pointer", display: "flex", alignItems: "center", gap: "6px", width: "fit-content" }}>
            Learn more <ChevronRight size={14} />
          </button>
        </div>
      </div>
    </>
  );
}

function StatCard({ icon, label, value, delta, tooltip }) {
  const [showTip, setShowTip] = useState(false);
  return (
    <div onMouseEnter={() => setShowTip(true)} onMouseLeave={() => setShowTip(false)} style={{ background: "#ffffff", border: "0.5px solid", borderColor: showTip ? "#BA7517" : "#E5E2D8", borderRadius: "12px", padding: "18px 20px", position: "relative", cursor: "help", transition: "border-color 0.15s ease" }}>
      <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "10px" }}>
        {icon}
        <div style={{ fontSize: "10px", color: "#888780", letterSpacing: "1.5px", fontWeight: 500 }}>{label}</div>
      </div>
      <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "26px", fontWeight: 500, letterSpacing: "-0.5px", lineHeight: 1, marginBottom: "6px" }}>{value}</div>
      <div style={{ fontSize: "11px", color: "#5F5E5A" }}>{delta}</div>
      {showTip && (
        <div style={{ position: "absolute", bottom: "calc(100% + 8px)", left: "50%", transform: "translateX(-50%)", background: "#2C2C2A", color: "#FDFBF5", padding: "10px 12px", borderRadius: "8px", fontSize: "11px", lineHeight: 1.5, width: "240px", zIndex: 10, boxShadow: "0 4px 20px rgba(0,0,0,0.12)" }}>
          {tooltip}
        </div>
      )}
    </div>
  );
}

function ActivityItem({ item, isLast }) {
  const [showTip, setShowTip] = useState(false);
  return (
    <div onMouseEnter={() => setShowTip(true)} onMouseLeave={() => setShowTip(false)} style={{ display: "flex", alignItems: "center", gap: "12px", padding: "12px 0", borderBottom: !isLast ? "0.5px solid #F1EFE8" : "none", position: "relative", cursor: "help" }}>
      <div style={{ width: "36px", height: "36px", borderRadius: "50%", background: "#FAEEDA", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "13px", fontWeight: 500, color: "#854F0B", flexShrink: 0 }}>{item.name[0]}</div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: "13px", color: "#2C2C2A", lineHeight: 1.4 }}><span style={{ fontWeight: 500 }}>{item.name}</span> {item.action}</div>
        <div style={{ fontSize: "11px", color: "#888780", marginTop: "2px" }}>{item.role} · Took {item.time} · <span style={{ color: "#BA7517" }}>{item.saved}</span></div>
      </div>
      {showTip && (
        <div style={{ position: "absolute", bottom: "calc(100% - 4px)", left: "48px", background: "#2C2C2A", color: "#FDFBF5", padding: "10px 12px", borderRadius: "8px", fontSize: "11px", lineHeight: 1.5, width: "280px", zIndex: 10, boxShadow: "0 4px 20px rgba(0,0,0,0.12)" }}>
          {item.tooltip}
        </div>
      )}
    </div>
  );
}

function ToolGuideScreen() {
  const [activeCategory, setActiveCategory] = useState("All");
  const [expandedTool, setExpandedTool] = useState(null);
  const [copiedPrompt, setCopiedPrompt] = useState(null);

  const categories = ["All", "Grant Writing", "Donor Outreach", "Admin", "Data Analysis", "Communications"];

  const tools = [
    { id: "gw-1", rank: 1, name: "Claude", by: "Anthropic", category: "Grant Writing", bestFor: "Long-form, nuanced writing", why: "Handles grant narratives with the tone and depth funders expect. Strong at structuring arguments.", recommended: true, updated: "Updated 3 days ago", featuredInAll: true, prompts: [{ label: "Consultant-style grant draft", usedBy: "7 teammates", text: "Act as a grant writing consultant. I'm applying to [FUNDER] for a [PROGRAM] grant. Before drafting, ask me 3 questions that will help you understand our organization, program, and the funder's priorities. Then draft a 2-page narrative." }, { label: "Grant revision pass", usedBy: "4 teammates", text: "Review this grant narrative as if you were a program officer at [FUNDER]. Flag anything unclear, weak, or unsupported." }] },
    { id: "gw-2", rank: 2, name: "ChatGPT", by: "OpenAI", category: "Grant Writing", bestFor: "Fast first drafts", why: "Quicker turnaround on initial outlines. Use it to get a rough structure, then polish with Claude.", updated: "Updated 5 days ago", prompts: [{ label: "Grant outline starter", usedBy: "3 teammates", text: "Create a grant proposal outline for [PROGRAM] targeting [FUNDER]." }] },

        },

        })
      });
      const data = await response.json();
      const text = data.content.map(c => c.text || "").join("");

    } catch (err) {
      const inputLower = input.toLowerCase();

      setResult({ bad: input, good: match.good, highlights: match.highlights, changes: match.changes, live: false });

      setLoading(false);

    highlights.forEach(phrase => {
      const newParts = [];
      parts.forEach(part => {

          const idx = part.toLowerCase().indexOf(phrase.toLowerCase());

            newParts.push(part.slice(0, idx));
            newParts.push({ highlight: part.slice(idx, idx + phrase.length) });

        <div style={{ position: "relative", zIndex: 1 }}>

            <button onClick={loadExample} style={{ background: "transparent", border: "0.5px solid #E5E2D8", color: "#5F5E5A", padding: "5px 10px", borderRadius: "6px", fontSize: "11px", cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: "5px" }}>
              <Shuffle size={11}/> Try an example
            </button>
          </div>
          <textarea value={input} onChange={(e) => setInput(e.target.value)} placeholder="e.g., 'write me a thank you email for a donor'" rows={3} style={{ width: "100%", border: "0.5px solid #D3D1C7", borderRadius: "8px", padding: "12px 14px", fontSize: "14px", outline: "none", background: "#FDFBF5", fontFamily: "inherit", resize: "vertical", color: "#2C2C2A", lineHeight: 1.5, boxSizing: "border-box" }} />
          <button onClick={handleTransform} disabled={!input.trim() || loading} style={{ marginTop: "12px", background: input.trim() && !loading ? "#2C2C2A" : "#D3D1C7", color: "#ffffff", border: "none", padding: "11px 22px", borderRadius: "8px", fontSize: "13px", fontWeight: 500, cursor: input.trim() && !loading ? "pointer" : "not-allowed", display: "flex", alignItems: "center", gap: "8px", fontFamily: "inherit" }}>
            {loading ? <><Loader2 size={14} style={{ animation: "spin 1s linear infinite" }}/> Optimizing...</> : <><Sparkles size={14}/> Transform my prompt</>}
          </button>
        </div>
      </div>

      {result && (
        <div style={{ animation: "fadeIn 0.4s ease" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: "14px", alignItems: "stretch", marginBottom: "14px" }}>

              <div style={{ fontSize: "10px", color: "#888780", letterSpacing: "1.8px", marginBottom: "10px", fontWeight: 500 }}>BEFORE</div>

  const [votedFeatures, setVotedFeatures] = useState([]);

  const upcoming = [
    { title: "Voice-to-text meeting transcription", status: "IN BETA", statusColor: "#3B6D11", statusBg: "#EAF3DE", description: "Instant transcripts with action items pulled out automatically.", eta: "Pro plans this month" },
    { title: "Donor sentiment analysis", status: "COMING Q2", statusColor: "#854F0B", statusBg: "#FAEEDA", description: "Flags donor emails that need a personal follow-up.", eta: "April 2026" },
    { title: "Slack & Teams integration", status: "IN DESIGN", statusColor: "#185FA5", statusBg: "#E6F1FB", description: "Lumen prompts inside your team chat. Slash commands, shared templates.", eta: "Designing with 8 pilot orgs" }
  ];

  const communityRequests = [
    { id: 1, title: "Grant deadline tracker with AI-drafted reminders", org: "From a youth services nonprofit", votes: 47 },
    { id: 2, title: "Spanish-language prompt templates", org: "From 3 community health orgs", votes: 32 },
    { id: 3, title: "Board meeting prep assistant", org: "From an arts foundation", votes: 28 }
  ];

  const handleSubmit = () => {
    if (feature.trim()) {
      setSubmitted(true);
      setTimeout(() => { setSubmitted(false); setFeature(""); }, 3500);
    }
  };

  const toggleVote = (id) => {
    if (votedFeatures.includes(id)) setVotedFeatures(votedFeatures.filter(v => v !== id));
    else setVotedFeatures([...votedFeatures, id]);
  };

  return (
    <>
      <div style={{ marginBottom: "28px" }}>
        <div style={{ fontSize: "11px", color: "#888780", letterSpacing: "2px", marginBottom: "6px" }}>WHAT'S NEXT</div>
        <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "30px", fontWeight: 500, letterSpacing: "-0.8px", lineHeight: 1.1, marginBottom: "8px" }}>Built <span style={{ color: "#BA7517", fontStyle: "italic" }}>with</span> you — not just for you.</div>
      </div>

      <div style={{ marginBottom: "32px" }}>
        <div style={{ fontSize: "11px", color: "#888780", letterSpacing: "1.8px", fontWeight: 500, marginBottom: "14px" }}>SHIPPING SOON</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: "14px" }}>
          {upcoming.map((item, i) => (
            <div key={i} style={{ background: "#ffffff", border: "0.5px solid #E5E2D8", borderRadius: "12px", padding: "20px 22px", display: "flex", flexDirection: "column" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "12px" }}>
                <div style={{ fontSize: "9px", color: item.statusColor, background: item.statusBg, padding: "3px 8px", borderRadius: "4px", letterSpacing: "1px", fontWeight: 500 }}>{item.status}</div>
              </div>
              <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "17px", fontWeight: 500, letterSpacing: "-0.3px", lineHeight: 1.25, marginBottom: "8px" }}>{item.title}</div>
              <div style={{ fontSize: "12px", color: "#5F5E5A", lineHeight: 1.5, marginBottom: "14px", flex: 1 }}>{item.description}</div>
              <div style={{ display: "flex", alignItems: "center", gap: "6px", fontSize: "11px", color: "#888780", borderTop: "0.5px solid #F1EFE8", paddingTop: "12px" }}>
                <Clock size={11}/> {item.eta}
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "14px" }}>
        <div style={{ background: "#2C2C2A", borderRadius: "14px", padding: "22px 24px", color: "#FDFBF5", display: "flex", flexDirection: "column" }}>
          <div style={{ fontSize: "11px", color: "#FAC775", letterSpacing: "2px", fontWeight: 500, marginBottom: "12px", display: "flex", alignItems: "center", gap: "8px" }}>
            <Sparkles size={12}/> SHAPE WHAT WE BUILD
          </div>
          <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "19px", fontWeight: 500, lineHeight: 1.25, marginBottom: "14px", letterSpacing: "-0.2px" }}>What should Lumen build next?</div>
          {submitted ? (
            <div style={{ background: "#3B6D11", border: "0.5px solid #97C459", borderRadius: "8px", padding: "14px 16px", display: "flex", alignItems: "center", gap: "10px", marginTop: "auto" }}>
              <Check size={16} color="#EAF3DE"/>
              <div style={{ fontSize: "13px", color: "#EAF3DE", lineHeight: 1.4 }}>Request logged. Reviewed every Friday.</div>
            </div>
          ) : (
            <div style={{ marginTop: "auto" }}>
              <textarea value={feature} onChange={(e) => setFeature(e.target.value)} placeholder="e.g., 'Auto-draft our monthly donor newsletter...'" rows={3} style={{ width: "100%", border: "0.5px solid #5F5E5A", borderRadius: "8px", padding: "10px 12px", fontSize: "13px", outline: "none", background: "#1A1A19", color: "#FDFBF5", fontFamily: "inherit", resize: "vertical", lineHeight: 1.5, boxSizing: "border-box" }} />
              <button onClick={handleSubmit} disabled={!feature.trim()} style={{ marginTop: "10px", background: feature.trim() ? "#EF9F27" : "#444441", color: feature.trim() ? "#412402" : "#888780", border: "none", padding: "10px 18px", borderRadius: "7px", fontSize: "12px", fontWeight: 500, cursor: feature.trim() ? "pointer" : "not-allowed", fontFamily: "inherit" }}>Submit request</button>
            </div>
          )}
        </div>

        <div style={{ background: "#ffffff", border: "0.5px solid #E5E2D8", borderRadius: "14px", padding: "22px 24px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "14px" }}>
            <div style={{ fontSize: "11px", color: "#888780", letterSpacing: "2px", fontWeight: 500 }}>COMMUNITY REQUESTS</div>
            <div style={{ fontSize: "11px", color: "#BA7517" }}>Vote to prioritize</div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
            {communityRequests.map(req => {
              const voted = votedFeatures.includes(req.id);
              const voteCount = voted ? req.votes + 1 : req.votes;
              return (
                <div key={req.id} style={{ display: "flex", gap: "10px", alignItems: "flex-start", padding: "10px 12px", background: "#FDFBF5", border: "0.5px solid #F1EFE8", borderRadius: "8px" }}>
                  <button onClick={() => toggleVote(req.id)} style={{ background: voted ? "#EF9F27" : "#ffffff", color: voted ? "#ffffff" : "#5F5E5A", border: "0.5px solid", borderColor: voted ? "#EF9F27" : "#D3D1C7", padding: "6px 8px", borderRadius: "6px", fontSize: "10px", cursor: "pointer", fontFamily: "inherit", display: "flex", flexDirection: "column", alignItems: "center", gap: "1px", minWidth: "36px", transition: "all 0.15s ease" }}>
                    <ArrowUp size={11}/>
                    <div style={{ fontSize: "10px", fontWeight: 500 }}>{voteCount}</div>
                  </button>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: "12px", color: "#2C2C2A", lineHeight: 1.4, fontWeight: 500, marginBottom: "2px" }}>{req.title}</div>
                    <div style={{ fontSize: "10px", color: "#888780" }}>{req.org}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </>
  );
}


function GetStartedScreen() {
  const [selectedTier, setSelectedTier] = useState(null);
  const [confirmed, setConfirmed] = useState(false);
  const [hasSigned, setHasSigned] = useState(false);
  const canvasRef = React.useRef(null);
  const drawing = React.useRef(false);

  const tiers = [
    {
      id: "starter",
      name: "Starter",
      price: "$0",
      period: "/ month",
      label: "FREE PILOT",
      features: ["5 users", "Limited course library", "Basic AI tool guide", "No credit card required"]
    },
    {
      id: "pro",
      name: "Pro",
      price: "$29",
      period: "/ month",
      label: "RECOMMENDED",
      featured: true,
      features: ["Up to 25 users", "Full course library", "Prompt Optimizer", "Workflow building"]
    },
    {
      id: "max",
      name: "Max",
      price: "$79",
      period: "/ month",
      label: "FOR LARGER TEAMS",
      features: ["Unlimited users", "Everything in Pro", "Custom integrations", "Dedicated support"]
    }
  ];

  const getCanvasPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  };

  const startDraw = (e) => {
    e.preventDefault();
    drawing.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = getCanvasPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const draw = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = getCanvasPos(e);
    ctx.lineTo(x, y);
    ctx.strokeStyle = "#2C2C2A";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
    setHasSigned(true);
  };

  const stopDraw = () => { drawing.current = false; };

  const clearSig = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setHasSigned(false);
  };

  const handleConfirm = () => { if (selectedTier && hasSigned) setConfirmed(true); };

  // ---- CONFIRMATION VIEW ----
  if (confirmed) {
    const tier = tiers.find(t => t.id === selectedTier);
    return (
      <div style={{ flex: 1, padding: "60px 56px", overflowY: "auto", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
        <div style={{ width: "72px", height: "72px", borderRadius: "50%", background: "#FAEEDA", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: "24px", animation: "popIn 0.4s ease-out" }}>
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#BA7517" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "34px", fontWeight: 500, letterSpacing: "-0.8px", lineHeight: 1.1, marginBottom: "12px", color: "#2C2C2A" }}>
          You're in.
        </div>
        <div style={{ fontSize: "15px", color: "#5F5E5A", maxWidth: "440px", lineHeight: 1.5, marginBottom: "32px" }}>
          Welcome to Lumen — <span style={{ color: "#2C2C2A", fontWeight: 500 }}>{tier.name}</span>. Your team will get onboarding details by tomorrow morning.
        </div>

        <div style={{ background: "#ffffff", border: "0.5px solid #E5E2D8", borderRadius: "10px", padding: "22px 28px", maxWidth: "440px", width: "100%", marginBottom: "16px" }}>
          <div style={{ fontSize: "10px", color: "#888780", letterSpacing: "1.5px", marginBottom: "10px", fontWeight: 500 }}>CONFIRMED PURCHASE</div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: "8px" }}>
            <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "20px", fontWeight: 500 }}>{tier.name}</div>
            <div style={{ fontSize: "14px", color: "#5F5E5A" }}>{tier.price}{tier.period}</div>
          </div>
          {tier.id === "pro" && (
            <div style={{ marginTop: "14px", padding: "12px 14px", background: "#FAEEDA", borderRadius: "8px", display: "flex", alignItems: "center", gap: "10px" }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BA7517" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/>
                <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
                <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
              </svg>
              <div style={{ fontSize: "12px", color: "#854F0B", lineHeight: 1.4 }}>
                <strong style={{ color: "#BA7517" }}>First month free</strong> — coupon redeemed via your Lumen sales rep.
              </div>
            </div>
          )}
        </div>

        <div style={{ fontSize: "11px", color: "#888780", fontStyle: "italic" }}>A receipt has been sent to your inbox.</div>

        <style>{`
          @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        `}</style>
      </div>
    );
  }

  // ---- SELECTION + SIGNATURE VIEW ----
  return (
    <div style={{ flex: 1, padding: "44px 56px", overflowY: "auto" }}>
      <div style={{ marginBottom: "24px" }}>
        <div style={{ fontSize: "11px", color: "#888780", letterSpacing: "2px", marginBottom: "6px" }}>GET STARTED</div>
        <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "30px", fontWeight: 500, letterSpacing: "-0.8px", lineHeight: 1.1, marginBottom: "8px" }}>
          Pick a plan. <span style={{ color: "#BA7517", fontStyle: "italic" }}>Start today.</span>
        </div>
        <div style={{ fontSize: "14px", color: "#5F5E5A", lineHeight: 1.5 }}>Tap a tier to select it, then sign below to confirm.</div>
      </div>

      {/* Tier cards */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "12px", marginBottom: "30px" }}>
        {tiers.map(tier => {
          const isSelected = selectedTier === tier.id;
          return (
            <div key={tier.id} onClick={() => setSelectedTier(tier.id)} style={{ background: isSelected ? "#FAEEDA" : "#ffffff", border: isSelected ? "2px solid #EF9F27" : (tier.featured ? "1px solid #FAC775" : "0.5px solid #D3D1C7"), borderRadius: "10px", padding: isSelected ? "17px" : "18px", cursor: "pointer", transition: "all 0.15s ease", position: "relative" }}>
              {tier.featured && !isSelected && (
                <div style={{ position: "absolute", top: "-9px", left: "50%", transform: "translateX(-50%)", background: "#EF9F27", color: "#ffffff", fontSize: "9px", fontWeight: 500, letterSpacing: "1.2px", padding: "3px 8px", borderRadius: "10px", whiteSpace: "nowrap" }}>RECOMMENDED</div>
              )}
              {isSelected && (
                <div style={{ position: "absolute", top: "10px", right: "10px", width: "20px", height: "20px", borderRadius: "50%", background: "#BA7517", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
              )}
              <div style={{ fontSize: "10px", color: tier.featured ? "#854F0B" : "#888780", letterSpacing: "1.5px", marginBottom: "8px", fontWeight: 500 }}>{tier.label}</div>
              <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "20px", fontWeight: 500, marginBottom: "4px" }}>{tier.name}</div>
              <div style={{ display: "flex", alignItems: "baseline", gap: "3px", marginBottom: "12px" }}>
                <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "26px", fontWeight: 500, color: tier.featured ? "#BA7517" : "#2C2C2A" }}>{tier.price}</div>
                <div style={{ fontSize: "11px", color: "#888780" }}>{tier.period}</div>
              </div>
              <div style={{ height: "0.5px", background: tier.featured ? "#FAC775" : "#E5E2D8", marginBottom: "10px" }}></div>
              <div style={{ fontSize: "11px", color: "#5F5E5A", lineHeight: 1.6 }}>
                {tier.features.map((f, i) => <div key={i}>{f}</div>)}
              </div>
            </div>
          );
        })}
      </div>

      {/* Signature pad */}
      <div style={{ background: "#ffffff", border: "0.5px solid #E5E2D8", borderRadius: "10px", padding: "20px 24px", marginBottom: "16px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" }}>
          <div style={{ fontSize: "11px", color: "#888780", letterSpacing: "1.5px", fontWeight: 500 }}>SIGN BELOW TO CONFIRM</div>
          {hasSigned && <button onClick={clearSig} style={{ background: "transparent", border: "none", cursor: "pointer", fontSize: "11px", color: "#888780", fontFamily: "inherit", textDecoration: "underline" }}>Clear</button>}
        </div>
        <canvas
          ref={canvasRef}
          width={900}
          height={150}
          onMouseDown={startDraw} onMouseMove={draw} onMouseUp={stopDraw} onMouseLeave={stopDraw}
          onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={stopDraw}
          style={{ width: "100%", height: "120px", border: "0.5px dashed #D3D1C7", borderRadius: "6px", background: "#FDFBF5", display: "block", touchAction: "none", cursor: "crosshair" }}
        ></canvas>
        <div style={{ fontSize: "10px", color: "#888780", marginTop: "6px", fontStyle: "italic" }}>x ____________________________________</div>
      </div>

      {/* Confirm button */}
      <button onClick={handleConfirm} disabled={!selectedTier || !hasSigned} style={{ width: "100%", background: (selectedTier && hasSigned) ? "#2C2C2A" : "#D3D1C7", color: "#ffffff", border: "none", padding: "14px", borderRadius: "8px", fontSize: "14px", fontWeight: 500, cursor: (selectedTier && hasSigned) ? "pointer" : "not-allowed", fontFamily: "inherit", letterSpacing: "0.3px", transition: "all 0.15s ease" }}>
        {!selectedTier ? "Select a plan to continue" : !hasSigned ? "Sign above to confirm" : "Confirm pilot →"}
      </button>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(LumenApp));
</script>
</body>
</html>
