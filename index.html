<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Turn sloppy prompts into sharp ones.</h1>

    <form id="form">
      <label for="input">YOUR PROMPT</label>
      <textarea id="input" rows="8" maxlength="4000"></textarea>
      <button type="submit" id="submit">Transform my prompt</button>
    </form>

    <p id="status" role="status"></p>

    <section id="result" hidden>
      <h2>AFTER</h2>
      <p id="improved"></p>
      <h2>WHAT CHANGED</h2>
      <ul id="changes"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
