<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 42 42" fill="none" aria-hidden="true">
        <path d="M11 7 L11 35 L31 35" stroke="#BA7517" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="31" cy="11" r="4" fill="#EF9F27"/>
        <circle cx="31" cy="11" r="7" fill="none" stroke="#EF9F27" stroke-width="1" opacity="0.4"/>
      </svg>
      <span class="brand-name">Lumen</span>
    </div>

    <header>
      <div class="eyebrow">PROMPT OPTIMIZER</div>
      <h1>Turn sloppy prompts into sharp ones.</h1>
      <div class="divider"></div>
      <p class="subhead">Paste how you'd normally ask AI for help. Lumen rewrites it into a prompt that actually works — and teaches you why.</p>
    </header>

    <form id="form" class="card">
      <div class="glow"></div>
      <div class="card-body">
        <div class="eyebrow amber" id="task-label">Task Optimizer</div>
        <div class="tasks" role="radiogroup" aria-labelledby="task-label">
          <button type="button" role="radio" aria-checked="true" data-task="grant" class="task selected">Grant proposal</button>
          <button type="button" role="radio" aria-checked="false" data-task="donor" class="task">Donor email</button>
          <button type="button" role="radio" aria-checked="false" data-task="volunteer" class="task">Volunteer outreach</button>
        </div>

        <div class="row">
          <label for="input" class="eyebrow amber">YOUR PROMPT</label>
          <button type="button" id="example" class="ghost">Try an example</button>
        </div>
        <textarea id="input" rows="4" maxlength="4000" placeholder="e.g., 'write me a thank you email for a donor'"></textarea>
        <button type="submit" id="submit" class="primary">Transform my prompt</button>
        <p id="status" role="status"></p>
      </div>
    </form>

    <section id="result" hidden>
      <div class="compare">
        <div class="card pane">
          <div class="eyebrow">BEFORE</div>
          <div class="mono" id="before"></div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
        <div class="card pane featured">
          <div class="eyebrow amber">AFTER</div>
          <div class="mono after" id="improved"></div>
        </div>
      </div>

      <div class="changes">
        <div class="eyebrow tint">WHAT CHANGED</div>
        <ol id="changes"></ol>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
